# Plano (Blueprint) para publicar el sistema en Render:
# un servicio web de pago (plan Starter) con un disco persistente donde viven los datos.
services:
  - type: web
    name: sistema-lafragua
    runtime: docker
    plan: starter
    healthCheckPath: /salud
    disk:
      name: datos
      mountPath: /data
      sizeGB: 2
    envVars:
      - key: DATA_DIR
        value: /data
      - key: LF_SETUP_TOKEN
        generateValue: true
